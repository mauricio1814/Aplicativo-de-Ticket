<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243f"><title>Soporte IT · Mesa de ayuda</title><style>
:root{--navy:#10243f;--blue:#2563eb;--ink:#172b4d;--muted:#64748b;--line:#e2e8f0;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:white}.hero{background:radial-gradient(ellipse at 20% 20%,#284c79,var(--navy) 65%);padding:8vw;color:white;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.05;max-width:530px;margin:20px 0}.hero p{max-width:440px;color:#ccdaeb;font-size:16px}.brand{font-size:20px;font-weight:800}.brand span{color:#73a7ff}.login-card{width:min(410px,90%);margin:auto}.login-card h2{font-size:28px;margin:0 0 5px}.login-card>p{color:var(--muted);margin:0 0 25px}.field{margin:0 0 14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px 11px;background:#fff;color:#23334d;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}.field textarea{resize:vertical;min-height:82px}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:700;background:var(--blue);color:white}.btn:hover{filter:brightness(.95)}.btn.full{width:100%}.btn.secondary{background:white;border:1px solid #cbd5e1;color:#334155}.error{color:#b91c1c;font-size:13px;min-height:20px}.demo,.hint{background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;padding:12px;margin-top:17px;color:#334155;font-size:12px}.demo b{color:#1d4ed8}.shell{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}.side{background:var(--navy);color:#d9e6f5;padding:22px 14px;display:flex;flex-direction:column}.side .brand{margin:2px 10px 28px;color:white}.nav{border:0;text-align:left;padding:11px 12px;border-radius:8px;margin:3px 0;color:#b9c9dc;background:transparent}.nav:hover,.nav.active{background:#1e3b63;color:white}.nav-bottom{margin-top:auto}.side-user{border-top:1px solid #ffffff20;margin:18px 4px 0;padding:14px 7px;display:flex;gap:10px;align-items:center;font-size:12px}.side-user small{display:block;color:#9fb1c7}.avatar{width:36px;height:36px;flex:none;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:800}.main{padding:26px clamp(16px,4vw,52px);max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.muted,.crumb{color:var(--muted);font-size:12px}.title-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.title{font-size:26px;margin:0}.sub{color:var(--muted);margin:4px 0 0}.card,.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 8px #0f172a08;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{margin:0;padding:15px}.stat-label{font-size:12px;color:var(--muted)}.stat-num{font-size:26px;font-weight:800}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:white}.filters input{min-width:230px}.table-wrap{overflow:auto}.tickets{width:100%;border-collapse:collapse;min-width:680px}.tickets th{text-align:left;font-size:10px;letter-spacing:.06em;color:var(--muted);padding:11px;border-bottom:1px solid var(--line)}.tickets td{padding:13px 11px;border-bottom:1px solid #edf1f6}.tickets tbody tr{cursor:pointer}.tickets tbody tr:hover{background:#f8fbff}.ticket-id{font-weight:750;color:#1d4ed8}.badge{font-size:10px;font-weight:750;border-radius:99px;padding:4px 9px;display:inline-block;background:#eff6ff;color:#1d4ed8;white-space:nowrap}.status-progress{background:#fef3c7;color:#92400e}.status-waiting{background:#f3e8ff;color:#7e22ce}.status-closed{background:#dcfce7;color:#166534}.priority-Crítica,.priority-Alta{background:#fee2e2;color:#991b1b}.priority-Media{background:#fef3c7;color:#92400e}.priority-Baja{background:#dcfce7;color:#166534}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span{grid-column:1/-1}.section-title{display:flex;align-items:center;gap:9px;margin-bottom:15px}.section-title h2{font-size:16px;margin:0}.section-title p{font-size:12px;color:var(--muted);margin:1px 0}.section-icon{width:29px;height:29px;border-radius:8px;background:#eff6ff;color:#2563eb;display:grid;place-items:center;font-weight:800}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 35px}.actions-right{display:flex;gap:8px}.req{color:#dc2626}.empty{text-align:center;color:var(--muted);padding:35px}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.detail-title{font-size:21px;margin:5px 0}.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.data-item{overflow-wrap:anywhere}.data-item small{display:block;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.05em}.description{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-top:5px}.timeline{border-left:2px solid #dbeafe;margin-left:7px;padding-left:17px}.event{position:relative;margin:0 0 15px}.event:before{content:"";position:absolute;left:-23px;top:5px;width:9px;height:9px;background:#3b82f6;border:2px solid white;box-shadow:0 0 0 1px #93c5fd;border-radius:50%}.side-card h3{font-size:14px;margin:0 0 12px}.alert{padding:12px;border-radius:9px;background:#eff6ff;color:#334155;font-size:12px;margin:12px 0}.toast{position:fixed;right:20px;bottom:20px;background:#10243f;color:white;padding:12px 17px;border-radius:9px;box-shadow:0 8px 30px #0003;z-index:4}.mobile{display:none}.footer{color:#94a3b8;font-size:11px;margin:22px 0}
@media(max-width:950px){.detail-layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.login{grid-template-columns:1fr}.hero{min-height:220px;padding:25px}.hero h1{font-size:32px;margin:14px 0}.hero p{font-size:14px}.login-card{padding:28px 0 35px}.shell{display:block;padding-bottom:58px}.side{display:none}.main{padding:16px 12px}.title{font-size:22px}.title-row{align-items:flex-start}.stats{gap:8px}.stat{padding:12px}.stat-num{font-size:22px}.grid,.data-grid{grid-template-columns:1fr}.span{grid-column:auto}.actions{align-items:stretch;flex-direction:column}.actions-right button{flex:1}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);z-index:3;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}.mobile button{border:0;background:none;color:#64748b;font-size:10px}.mobile button.active{color:#2563eb;font-weight:700}}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden"></div><script>
(()=>{'use strict';let me=null,view='dashboard',all=[],technicians=[],filter='',statusFilter='Todos',detailId=null;const app=document.querySelector('#app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initials=n=>(n||'U').split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase();const date=s=>s?new Date(s).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}):'No indicada';async function api(path,options={}){let res=await fetch(path,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let body=await res.json().catch(()=>({}));if(!res.ok){if(res.status===401&&path!='/api/login'){me=null;render()}throw Error(body.error||'No se pudo completar la solicitud.')}return body}function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2700)}function badge(s){let c={'En progreso':'status-progress','Esperando usuario':'status-waiting','Resuelto':'status-closed','Cerrado':'status-closed'}[s]||'';return `<span class="badge ${c}">${esc(s)}</span>`}function priority(s){return `<span class="badge priority-${esc(s)}">${esc(s)}</span>`}async function reload(){all=(await api('/api/tickets')).tickets;if(me.role==='tech')technicians=(await api('/api/technicians')).technicians}function go(v){view=v;detailId=null;render()}function login(){app.innerHTML=`<div class="login"><section class="hero"><div class="brand">soporte<span>·</span>IT</div><h1>Tu mesa de ayuda, en un solo lugar.</h1><p>Reporta incidentes, sigue tus solicitudes y mantén el equipo trabajando.</p></section><section class="login-card"><h2>Bienvenido</h2><p>Ingresa a la mesa de ayuda de tu organización.</p><form id="loginForm"><div class="field"><label>Correo electrónico</label><input name="email" type="email" autocomplete="username" required placeholder="tu@empresa.com"></div><div class="field"><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña"></div><div id="err" class="error"></div><button class="btn full">Iniciar sesión</button></form><div class="demo"><b>Cuentas de demostración</b><br>Usuario: usuario@demo.com · usuario123<br>Técnico: tecnico@demo.com · tecnico123</div><p class="muted" style="margin-top:16px">Cambia las cuentas de demostración antes de usar datos reales.</p></section></div>`;app.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.currentTarget));try{me=(await api('/api/login',{method:'POST',body:JSON.stringify(f)})).user;await reload();view='dashboard';render()}catch(err){app.querySelector('#err').textContent=err.message}}}function nav(){let links=me.role==='tech'?[['dashboard','▦','Panel técnico'],['tickets','▤','Todos los tickets']]:[['dashboard','⌂','Resumen'],['tickets','▣','Mis tickets'],['new','＋','Crear solicitud']];return `<aside class="side"><div class="brand">soporte<span>·</span>IT</div>${links.map(([v,i,l])=>`<button class="nav ${view===v?'active':''}" data-view="${v}">${i} &nbsp; ${l}</button>`).join('')}<div class="nav-bottom"><div class="side-user"><div class="avatar">${initials(me.name)}</div><div>${esc(me.name)}<small>${me.role==='tech'?'Técnico':'Solicitante'}</small></div></div><button class="nav" data-logout>↪ &nbsp; Cerrar sesión</button></div></aside>`}function shell(content){let links=me.role==='tech'?[['dashboard','▦','Panel'],['tickets','▤','Tickets']]:[['dashboard','⌂','Inicio'],['tickets','▣','Tickets'],['new','＋','Crear']];return `<div class="shell">${nav()}<main class="main"><div class="top"><div class="crumb">Mesa de ayuda / ${view==='new'?'Nueva solicitud':view==='detail'?'Detalle del ticket':me.role==='tech'?'Panel técnico':'Mis tickets'}</div><div style="display:flex;align-items:center;gap:10px"><span class="muted">${esc(me.name)}</span><div class="avatar">${initials(me.name)}</div></div></div>${content}</main><div class="mobile">${links.map(([v,i,l])=>`<button class="${view===v?'active':''}" data-view="${v}">${i}<br>${l}</button>`).join('')}<button data-logout>↪<br>Salir</button></div></div>`}function table(rows){if(!rows.length)return `<div class="empty">No hay tickets para mostrar.</div>`;return `<div class="table-wrap"><table class="tickets"><thead><tr><th>TICKET</th><th>ASUNTO / EQUIPO</th>${me.role==='tech'?'<th>SOLICITANTE</th>':''}<th>ESTADO</th><th>PRIORIDAD</th><th>ACTUALIZADO</th></tr></thead><tbody>${rows.map(t=>`<tr data-ticket="${esc(t.id)}"><td><span class="ticket-id">${esc(t.id)}</span></td><td><b>${esc(t.subject)}</b><div class="muted">${esc(t.assetType)} · ${esc(t.assetModel||t.assetName||'Sin modelo')}</div></td>${me.role==='tech'?`<td>${esc(t.name)}<div class="muted">${esc(t.job)} · ${esc(t.area)}</div></td>`:''}<td>${badge(t.status)}</td><td>${priority(t.priority)}</td><td class="muted">${date(t.updatedAt)}</td></tr>`).join('')}</tbody></table></div>`}function dashboard(){let open=all.filter(t=>!['Resuelto','Cerrado'].includes(t.status)).length,prog=all.filter(t=>t.status==='En progreso').length,done=all.filter(t=>['Resuelto','Cerrado'].includes(t.status)).length;return `<div class="title-row"><div><h1 class="title">${me.role==='tech'?'Panel de soporte':'Hola, '+esc(me.name.split(' ')[0])}</h1><p class="sub">${me.role==='tech'?'Solicitudes reportadas por los usuarios.':'Consulta el avance o crea una solicitud.'}</p></div>${me.role==='user'?'<button class="btn" data-view="new">＋ Crear ticket</button>':''}</div><div class="stats"><div class="stat"><div class="stat-label">${me.role==='tech'?'Tickets activos':'Mis tickets abiertos'}</div><div class="stat-num">${open}</div></div><div class="stat"><div class="stat-label">En progreso</div><div class="stat-num">${prog}</div></div><div class="stat"><div class="stat-label">Resueltos</div><div class="stat-num">${done}</div></div><div class="stat"><div class="stat-label">Total</div><div class="stat-num">${all.length}</div></div></div><section class="card"><div class="title-row"><div><b>${me.role==='tech'?'Solicitudes recientes':'Actividad reciente'}</b><div class="muted">Selecciona una fila para ver el detalle.</div></div><button class="btn secondary" data-view="tickets">Ver todos</button></div>${table(all.slice(0,5))}</section>`}function listing(){let rows=all.filter(t=>(statusFilter==='Todos'||t.status===statusFilter)&&(!filter||`${t.id} ${t.subject} ${t.name} ${t.assetType}`.toLowerCase().includes(filter.toLowerCase())));return `<div class="title-row"><div><h1 class="title">${me.role==='tech'?'Bandeja de tickets':'Mis tickets'}</h1><p class="sub">${me.role==='tech'?'Abre un caso para revisar el reporte y gestionarlo.':'Tus solicitudes y su estado actual.'}</p></div>${me.role==='user'?'<button class="btn" data-view="new">＋ Crear ticket</button>':''}</div><div class="stats"><div class="stat"><div class="stat-label">Resultados</div><div class="stat-num">${rows.length}</div></div><div class="stat"><div class="stat-label">Abiertos</div><div class="stat-num">${all.filter(t=>t.status==='Abierto').length}</div></div><div class="stat"><div class="stat-label">En progreso</div><div class="stat-num">${all.filter(t=>t.status==='En progreso').length}</div></div><div class="stat"><div class="stat-label">Resueltos</div><div class="stat-num">${all.filter(t=>['Resuelto','Cerrado'].includes(t.status)).length}</div></div></div><section class="card"><div class="filters"><input id="search" placeholder="Buscar ticket, asunto o solicitante…" value="${esc(filter)}"><select id="status"><option>Todos</option>${['Abierto','En progreso','Esperando usuario','Resuelto','Cerrado'].map(x=>`<option ${x===statusFilter?'selected':''}>${x}</option>`).join('')}</select></div><div id="rows">${table(rows)}</div></section>`}function form(){return `<div class="title-row"><div><h1 class="title">Crear ticket de soporte</h1><p class="sub">Describe la falla para que el técnico pueda reproducirla.</p></div></div><form id="ticketForm"><section class="card"><div class="section-title"><span class="section-icon">01</span><div><h2>¿Quién necesita ayuda?</h2><p>Datos de contacto y ubicación</p></div></div><div class="grid"><div class="field"><label>Nombre</label><input value="${esc(me.name)}" readonly></div><div class="field"><label>Correo</label><input value="${esc(me.email)}" readonly></div><div class="field"><label>Cargo / puesto <i class="req">*</i></label><input name="job" required value="${esc(me.job)}"></div><div class="field"><label>Área <i class="req">*</i></label><input name="area" required value="${esc(me.area)}"></div><div class="field"><label>Sede / ubicación <i class="req">*</i></label><input name="location" required value="${esc(me.location)}"></div><div class="field"><label>Teléfono / extensión</label><input name="phone" value="${esc(me.phone)}"></div></div></section><section class="card"><div class="section-title"><span class="section-icon">02</span><div><h2>Equipo afectado</h2><p>Identifica el activo que presenta la falla</p></div></div><div class="grid"><div class="field"><label>Tipo de equipo <i class="req">*</i></label><select name="assetType" required><option value="">Selecciona</option>${['Computador portátil','Computador de escritorio / torre','Celular','Monitor','Mouse','Teclado','Impresora','Otro periférico','Software / acceso','Otro'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Código de inventario</label><input name="assetTag" placeholder="Ej. EQ-10482"></div><div class="field"><label>Marca y modelo</label><input name="assetModel" placeholder="Ej. Dell Latitude 5440"></div><div class="field"><label>Número de serie</label><input name="serial" placeholder="Opcional"></div><div class="field span"><label>Nombre de equipo o descripción</label><input name="assetName" placeholder="Etiqueta visible para localizarlo"></div></div></section><section class="card"><div class="section-title"><span class="section-icon">03</span><div><h2>Describe el problema</h2><p>Incluye cuándo ocurre y cómo reproducir la falla</p></div></div><div class="grid"><div class="field span"><label>Asunto breve <i class="req">*</i></label><input name="subject" required maxlength="120" placeholder="Ej. El computador se apaga al desconectar el cargador"></div><div class="field"><label>Prioridad percibida <i class="req">*</i></label><select name="priority" required><option value="">Selecciona</option>${['Baja','Media','Alta','Crítica'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>¿Cuándo empezó?</label><input type="datetime-local" name="started"></div><div class="field span"><label>¿Qué ocurrió? <i class="req">*</i></label><textarea name="description" required placeholder="Mensaje de error o comportamiento observado y qué esperabas."></textarea></div><div class="field span"><label>Pasos para reproducir <i class="req">*</i></label><textarea name="steps" required placeholder="1. Abro… 2. Hago clic… 3. Aparece…"></textarea></div><div class="field span"><label>Frecuencia y pruebas que intentaste</label><textarea name="attempts" placeholder="¿Pasa siempre? ¿Reiniciaste o probaste otro cable?"></textarea></div><div class="field span"><label>Enlace a evidencia (opcional)</label><input name="attachment" type="url" placeholder="URL de una captura compartida"></div></div></section><div class="actions"><span class="muted"><i class="req">*</i> Obligatorio</span><div class="actions-right"><button type="button" class="btn secondary" data-view="dashboard">Cancelar</button><button class="btn">Enviar ticket →</button></div></div></form>`}function detail(t,events){return `<div class="title-row"><button class="btn secondary" data-view="tickets">← Volver</button></div><div class="detail-layout"><div><section class="card"><div class="title-row"><div><span class="ticket-id">${esc(t.id)}</span><h1 class="detail-title">${esc(t.subject)}</h1><span class="muted">Creado ${date(t.createdAt)}</span></div><div>${badge(t.status)} ${priority(t.priority)}</div></div><hr style="border:0;border-top:1px solid #e2e8f0;margin:16px 0"><div class="data-grid"><div class="data-item"><small>SOLICITANTE</small>${esc(t.name)}<div class="muted">${esc(t.job)} · ${esc(t.area)}</div></div><div class="data-item"><small>CONTACTO</small>${esc(t.email)}<div class="muted">${esc(t.phone||'Sin teléfono')}</div></div><div class="data-item"><small>UBICACIÓN</small>${esc(t.location)}</div><div class="data-item"><small>EQUIPO</small>${esc(t.assetType)}<div class="muted">${esc(t.assetTag||'Sin placa')} · ${esc(t.assetModel||'Sin modelo')}</div></div><div class="data-item"><small>SERIE / NOMBRE</small>${esc(t.serial||'No indicado')} · ${esc(t.assetName)}</div><div class="data-item"><small>FECHA DE INICIO</small>${date(t.started)}</div></div></section><section class="card"><b>Reporte del usuario</b><div class="muted" style="margin-top:12px">QUÉ OCURRIÓ</div><div class="description">${esc(t.description)}</div><div class="muted" style="margin-top:12px">PASOS PARA REPRODUCIR</div><div class="description">${esc(t.steps)}</div><div class="muted" style="margin-top:12px">FRECUENCIA / PRUEBAS</div><div class="description">${esc(t.attempts||'No especificado')}</div>${t.attachment?`<p><a href="${esc(t.attachment)}" target="_blank" rel="noopener">Abrir evidencia</a></p>`:''}</section><section class="card"><b>Actividad del ticket</b><div class="timeline" style="margin-top:15px">${events.map(e=>`<div class="event"><b>${esc(e.text)}</b><div>${esc(e.by)}</div><small class="muted">${date(e.at)}</small></div>`).join('')}</div>${me.role==='tech'?`<form id="note"><div class="field"><label>Actualización para el usuario</label><textarea name="message" required placeholder="Avance, diagnóstico o información solicitada"></textarea></div><button class="btn secondary">Agregar actualización</button></form>`:''}</section></div><aside>${me.role==='tech'?`<section class="card side-card"><h3>Gestión del ticket</h3><form id="manage"><div class="field"><label>Estado</label><select name="status">${['Abierto','En progreso','Esperando usuario','Resuelto','Cerrado'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Prioridad</label><select name="priority">${['Baja','Media','Alta','Crítica'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Asignar técnico</label><select name="assignee"><option value="">Sin asignar</option>${technicians.map(x=>`<option value="${esc(x.email)}" ${t.assignee===x.email?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><button class="btn full">Guardar cambios</button></form></section>`:`<section class="card side-card"><h3>Estado actual</h3>${badge(t.status)}<p class="muted">Actualizado: ${date(t.updatedAt)}</p><p class="muted">Técnico: ${esc(t.assigneeName||'Aún sin asignar')}</p></section>`}<div class="alert">${t.status==='Esperando usuario'?'El técnico necesita información adicional. Revisa la actividad del ticket.':t.status==='Resuelto'?'La solicitud fue marcada como resuelta.':`Este ticket está guardado en la base de datos del servidor.`}</div></aside></div>`}function bind(){app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));app.querySelectorAll('[data-logout]').forEach(b=>b.onclick=logout);app.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>{detailId=b.dataset.ticket;view='detail';render()});let s=app.querySelector('#status');if(s)s.onchange=()=>{statusFilter=s.value;render()};let q=app.querySelector('#search');if(q)q.oninput=()=>{filter=q.value;let pos=q.selectionStart;app.querySelector('#rows').innerHTML=table(all.filter(t=>(statusFilter==='Todos'||t.status===statusFilter)&&(`${t.id} ${t.subject} ${t.name} ${t.assetType}`.toLowerCase().includes(filter.toLowerCase()))));bind();let n=app.querySelector('#search');n.focus();n.setSelectionRange(pos,pos)};let f=app.querySelector('#ticketForm');if(f)f.onsubmit=async e=>{e.preventDefault();let b=f.querySelector('button[type="submit"]');b.disabled=true;try{let out=await api('/api/tickets',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});await reload();detailId=out.id;view='detail';await render();toast('Ticket creado: '+out.id)}catch(err){alert(err.message);b.disabled=false}};let m=app.querySelector('#manage');if(m)m.onsubmit=async e=>{e.preventDefault();try{await api('/api/tickets/'+encodeURIComponent(detailId),{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(m)))});await render();toast('Cambios guardados')}catch(err){alert(err.message)}};let n=app.querySelector('#note');if(n)n.onsubmit=async e=>{e.preventDefault();try{await api('/api/tickets/'+encodeURIComponent(detailId)+'/updates',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(n)))});await render();toast('Actualización agregada')}catch(err){alert(err.message)}}}async function render(){if(!me){login();return}try{await reload()}catch(e){app.innerHTML=`<div style="padding:40px">No se pudo conectar con el servidor: ${esc(e.message)}. Recarga la página.</div>`;return}let content;if(view==='new')content=form();else if(view==='tickets')content=listing();else if(view==='detail'){try{let d=await api('/api/tickets/'+encodeURIComponent(detailId));content=detail(d.ticket,d.events)}catch(e){content=`<section class="card">${esc(e.message)} <button class="btn secondary" data-view="tickets">Volver</button></section>`}}else content=dashboard();app.innerHTML=shell(content);bind()}async function logout(){try{await api('/api/logout',{method:'POST',body:'{}'})}catch{}me=null;view='dashboard';render()}async function init(){try{me=(await api('/api/me')).user}catch{me=null}await render()}init()})();
</script></body></html>
